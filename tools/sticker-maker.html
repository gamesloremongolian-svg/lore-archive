<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090817"><title>LOREVERSE Sticker Lab</title>
<style>
:root{color-scheme:dark;--bg:#090817;--panel:#17132a;--line:#49345f;--text:#fff8ff;--muted:#c0b4d2;--pink:#ff8bcf;--cyan:#75e7ff;--violet:#c07bff}
*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(ellipse at 10% 0%,#672b7855,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
.app{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}.preview,.tools{background:linear-gradient(145deg,#211633,#12182a);border:1px solid var(--line);border-radius:18px;padding:16px}.preview h2,.tools h2{margin:0 0 12px;font-size:17px}.stage{min-height:480px;display:grid;place-items:center;border:1px dashed #76568c;border-radius:14px;background-color:#111326;background-image:linear-gradient(45deg,#ffffff09 25%,transparent 25%),linear-gradient(-45deg,#ffffff09 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff09 75%),linear-gradient(-45deg,transparent 75%,#ffffff09 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;overflow:hidden}
canvas{display:block;width:min(100%,640px);height:auto;aspect-ratio:1;object-fit:contain;touch-action:none;cursor:grab;filter:drop-shadow(0 8px 22px #0008)}canvas.dragging{cursor:grabbing}
label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}input,select,textarea{width:100%;background:#090b17;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px;font:inherit}input[type=color]{height:39px;padding:3px}input[type=range]{padding:0;accent-color:var(--pink)}input[type=file]{font-size:12px}
button{border:0;border-radius:10px;background:linear-gradient(110deg,#e76fbc,#9862f4 58%,#4cb9df);color:white;font-weight:800;padding:10px 12px;cursor:pointer;width:100%;margin-top:8px}.secondary{background:#29213b;border:1px solid #624477}.danger{background:#67334b;border:1px solid #a14e70}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{color:var(--muted);font-size:11px;margin:8px 0}.status{font-size:12px;color:var(--cyan);min-height:20px;margin-top:8px}.layers{display:grid;gap:6px;margin-top:8px}.layer{display:flex;gap:6px;align-items:center;background:#0c0b1b;border:1px solid var(--line);padding:7px;border-radius:9px}.layer.active{border-color:var(--pink);background:#38203d}.layer button{width:auto;min-width:36px;margin:0;padding:7px}.layer .pick{flex:1;text-align:left;background:transparent;border:0;padding:5px}.layer small{color:var(--muted)}
@media(max-width:820px){body{padding:9px}.app{grid-template-columns:1fr}.stage{min-height:300px}.tools{order:2}.preview{order:1}}
</style><link rel="stylesheet" href="../assets/css/loreverse-shell.css?v=20261120-4">
</head><body><main class="app">
<section class="preview"><h2>✦ Стикерийн урьдчилсан харагдац</h2><div class="stage"><canvas id="canvas" width="640" height="640" aria-label="Стикер засварлах талбар"></canvas></div><p class="hint">Объект дээр дарж сонгоод чирж байрлуулна. Сонгосон давхаргын хэмжээг баруун талын хэсгээс өөрчилнө. Алаг дэвсгэр экспортод орохгүй.</p></section>
<aside class="tools"><h2>Sticker Studio</h2>
<label for="image">Зураг оруулах</label><input id="image" type="file" accept="image/*">
<div class="row"><button id="addText" type="button">＋ Текст нэмэх</button><button id="addEmoji" class="secondary" type="button">＋ Emoji нэмэх</button></div>
<label for="emoji">Emoji сонгох</label><select id="emoji"><option>✨</option><option>❤️</option><option>🔥</option><option>😂</option><option>😭</option><option>⭐</option><option>💜</option><option>⚡</option><option>🌸</option><option>😎</option><option>🎮</option></select>
<label>Давхаргууд</label><div id="layers" class="layers"><small>Одоогоор давхарга алга.</small></div>
<div id="editor" hidden>
<label for="layerText">Текст</label><input id="layerText" maxlength="70" placeholder="Текстээ бичнэ үү">
<div class="row"><div><label for="font">Хэмжээ</label><input id="font" type="range" min="16" max="180" value="64"></div><div><label for="layerColor">Өнгө</label><input id="layerColor" type="color" value="#ffffff"></div></div>
<div class="row"><div><label for="outline">Хүрээний өнгө</label><input id="outline" type="color" value="#171326"></div><div><label for="width">Хүрээний өргөн</label><input id="width" type="range" min="0" max="24" value="8"></div></div>
<label for="scale">Зураг / Emoji хэмжээ</label><input id="scale" type="range" min="20" max="600" value="220">
<div class="row"><button id="front" class="secondary" type="button">Урагш</button><button id="back" class="secondary" type="button">Хойш</button></div>
<button id="deleteLayer" class="danger" type="button">Сонгосон давхаргыг устгах</button>
</div>
<div class="row"><button id="undo" class="secondary" type="button">Бүгдийг цэвэрлэх</button><button id="download" type="button">PNG татах</button></div>
<button id="copy" class="secondary" type="button">Зураг хуулах</button><div class="status" id="status" aria-live="polite"></div>
<p class="hint">Бүх засвар таны хөтөч дээр хийгдэнэ. Зураг сервер рүү автоматаар илгээгдэхгүй.</p></aside></main>
<script>
(()=> {
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let layers=[],selected=null,nextId=1,drag=null;
const defaults={x:320,y:320,size:64,color:'#ffffff',outline:'#171326',stroke:8};
function say(s){$('status').textContent=s}
function current(){return layers.find(x=>x.id===selected)}
function addLayer(type,extra={}){const l={id:nextId++,type,x:320,y:320,size:type==='image'?420:64,color:defaults.color,outline:defaults.outline,stroke:defaults.stroke,text:'Шинэ текст',emoji:'✨',img:null,...extra};layers.push(l);selected=l.id;render();syncEditor();say('Шинэ давхарга нэмэгдлээ. Чирж байрлуулж болно.')}
function drawLayer(l){
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
 if(l.type==='image'&&l.img){const ratio=Math.min(l.size/l.img.width,l.size/l.img.height);const w=l.img.width*ratio,h=l.img.height*ratio;ctx.drawImage(l.img,l.x-w/2,l.y-h/2,w,h);}
 else if(l.type==='emoji'){ctx.font=l.size+'px system-ui, "Apple Color Emoji", "Segoe UI Emoji"';ctx.fillText(l.emoji,l.x,l.y);}
 else {ctx.font='900 '+l.size+'px system-ui, sans-serif';ctx.lineJoin='round';ctx.lineWidth=l.stroke*2;ctx.strokeStyle=l.outline;if(l.stroke)ctx.strokeText(l.text||' ',l.x,l.y,590);ctx.fillStyle=l.color;ctx.fillText(l.text||' ',l.x,l.y,590);}
 ctx.restore();
}
function render(){ctx.clearRect(0,0,640,640);layers.forEach(drawLayer);const l=current();if(l){ctx.save();ctx.strokeStyle='#75e7ff';ctx.lineWidth=2;ctx.setLineDash([7,5]);const w=l.type==='text'?Math.max(90,l.size*3):Math.max(70,l.size);const h=l.type==='text'?l.size*1.45:Math.max(70,l.size);ctx.strokeRect(l.x-w/2,l.y-h/2,w,h);ctx.setLineDash([]);ctx.restore();}}
function syncLayers(){const box=$('layers');if(!layers.length){box.innerHTML='<small>Одоогоор давхарга алга.</small>';return;}box.innerHTML=layers.map((l,i)=>'<div class="layer '+(l.id===selected?'active':'')+'"><button class="pick" data-pick="'+l.id+'">'+(l.type==='image'?'🖼 Зураг':l.type==='emoji'?l.emoji+' Emoji':'T Текст')+' <small>#'+(i+1)+'</small></button><button class="secondary" data-up="'+l.id+'" title="Давхаргыг урагшлуулах">↑</button><button class="secondary" data-down="'+l.id+'" title="Давхаргыг хойшлуулах">↓</button></div>').join('');box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected=+b.dataset.pick;syncEditor();render();syncLayers()});box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveLayer(+b.dataset.up,1));box.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveLayer(+b.dataset.down,-1));}
function moveLayer(id,dir){const i=layers.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=layers.length)return;[layers[i],layers[j]]=[layers[j],layers[i]];render();syncLayers()}
function syncEditor(){const l=current(),ed=$('editor');ed.hidden=!l;if(!l)return;$('layerText').value=l.type==='text'?l.text:'';$('layerText').disabled=l.type!=='text';$('font').value=l.size;$('font').disabled=l.type==='image'||l.type==='emoji';$('layerColor').value=l.color;$('layerColor').disabled=l.type!=='text';$('outline').value=l.outline;$('outline').disabled=l.type!=='text';$('width').value=l.stroke;$('width').disabled=l.type!=='text';$('scale').value=l.size;$('scale').disabled=l.type==='text';}
function updateFromControls(){const l=current();if(!l)return;l.text=$('layerText').value;l.size=+$('font').value;l.color=$('layerColor').value;l.outline=$('outline').value;l.stroke=+$('width').value;if(l.type!=='text')l.size=+$('scale').value;render();syncLayers()}
['layerText','font','layerColor','outline','width','scale'].forEach(id=>$(id).addEventListener('input',updateFromControls));
$('addText').onclick=()=>addLayer('text');
$('addEmoji').onclick=()=>addLayer('emoji',{emoji:$('emoji').value,size:72});
$('image').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){say('Зургийн файл сонгоно уу.');return;}const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{addLayer('image',{img:im,size:Math.min(500,Math.max(im.width,im.height))});URL.revokeObjectURL(url);say('Зураг нэмэгдлээ. Чирж байрлуулж, хэмжээг тохируулна уу.')};im.onerror=()=>{URL.revokeObjectURL(url);say('Зураг нээж чадсангүй.')};im.src=url;e.target.value=''});
$('deleteLayer').onclick=()=>{layers=layers.filter(x=>x.id!==selected);selected=layers.length?layers[layers.length-1].id:null;render();syncLayers();syncEditor();say('Давхарга устгагдлаа.')};
$('front').onclick=()=>{const i=layers.findIndex(x=>x.id===selected);if(i>=0&&i<layers.length-1){const [l]=layers.splice(i,1);layers.push(l);render();syncLayers()}};
$('back').onclick=()=>{const i=layers.findIndex(x=>x.id===selected);if(i>0){const [l]=layers.splice(i,1);layers.unshift(l);render();syncLayers()}};
$('undo').onclick=()=>{layers=[];selected=null;render();syncLayers();syncEditor();$('image').value='';say('Бүх давхаргыг цэвэрлэлээ.')};
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*640/r.height}}
function hit(l,p){const w=l.type==='text'?Math.max(100,l.size*3):Math.max(72,l.size),h=l.type==='text'?l.size*1.5:Math.max(72,l.size);return p.x>=l.x-w/2-10&&p.x<=l.x+w/2+10&&p.y>=l.y-h/2-10&&p.y<=l.y+h/2+10}
canvas.addEventListener('pointerdown',e=>{const p=point(e);let l=[...layers].reverse().find(x=>hit(x,p));if(!l)return;selected=l.id;drag={id:l.id,dx:p.x-l.x,dy:p.y-l.y};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);syncEditor();syncLayers();render()});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const l=current();if(!l||l.id!==drag.id)return;const p=point(e);l.x=Math.max(0,Math.min(640,p.x-drag.dx));l.y=Math.max(0,Math.min(640,p.y-drag.dy));render()});
function stopDrag(){drag=null;canvas.classList.remove('dragging')}
canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
$('download').onclick=()=>{render();canvas.toBlob(blob=>{if(!blob){say('PNG үүсгэж чадсангүй.');return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='loreverse-sticker.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('PNG таталт эхэллээ.')},'image/png')};
$('copy').onclick=async()=>{try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG үүсгэсэнгүй.');if(!navigator.clipboard?.write)throw Error('Энэ хөтөч зураг хуулахыг дэмжихгүй байна. PNG татах товчийг ашиглаарай.');await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);say('Зураг clipboard-д хуулагдлаа.')}catch(e){say(e.message)}};
render();syncLayers();
})();
</script></body></html>
