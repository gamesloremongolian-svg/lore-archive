<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090817"><title>LOREVERSE Sticker Lab</title>
<style>
:root{color-scheme:dark;--bg:#090817;--panel:#17132a;--line:#49345f;--text:#fff8ff;--muted:#c0b4d2;--pink:#ff8bcf;--cyan:#75e7ff;--violet:#c07bff}
*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at 10% 0%,#672b7855,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
.app{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.preview,.tools{background:linear-gradient(145deg,#211633,#12182a);border:1px solid var(--line);border-radius:18px;padding:16px}.preview h2,.tools h2{margin:0 0 12px;font-size:17px}.stage{min-height:420px;display:grid;place-items:center;border:1px dashed #76568c;border-radius:14px;background-color:#111326;background-image:linear-gradient(45deg,#ffffff09 25%,transparent 25%),linear-gradient(-45deg,#ffffff09 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff09 75%),linear-gradient(-45deg,transparent 75%,#ffffff09 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}
canvas{max-width:100%;max-height:520px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 8px 22px #0008)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}input,select,textarea{width:100%;background:#090b17;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;font:inherit}input[type=color]{height:42px;padding:4px}input[type=range]{padding:0;accent-color:var(--pink)}input[type=file]{font-size:12px}button{border:0;border-radius:10px;background:linear-gradient(110deg,#e76fbc,#9862f4 58%,#4cb9df);color:white;font-weight:800;padding:11px 13px;cursor:pointer;width:100%;margin-top:10px}.secondary{background:#29213b;border:1px solid #624477}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{color:var(--muted);font-size:11px;margin:8px 0}.status{font-size:12px;color:var(--cyan);min-height:20px;margin-top:8px}
@media(max-width:760px){body{padding:10px}.app{grid-template-columns:1fr}.stage{min-height:300px}.tools{order:2}.preview{order:1}}
</style></head><body><main class="app">
<section class="preview"><h2>✦ Стикерийн урьдчилсан харагдац</h2><div class="stage"><canvas id="canvas" width="640" height="640"></canvas></div><p class="hint">Алаг дэвсгэр нь тунгалаг хэсгийг илэрхийлнэ. PNG татахад дэвсгэр тунгалаг хэвээр хадгалагдана.</p></section>
<aside class="tools"><h2>Sticker Studio</h2>
<label for="image">Зураг оруулах</label><input id="image" type="file" accept="image/*">
<label for="caption">Стикерийн текст</label><input id="caption" maxlength="70" placeholder="Жишээ: NICE!">
<div class="row"><div><label for="font">Фонтын хэмжээ</label><input id="font" type="range" min="24" max="120" value="64"></div><div><label for="color">Текстийн өнгө</label><input id="color" type="color" value="#ffffff"></div></div>
<div class="row"><div><label for="outline">Хүрээний өнгө</label><input id="outline" type="color" value="#171326"></div><div><label for="width">Хүрээний өргөн</label><input id="width" type="range" min="0" max="24" value="10"></div></div>
<label for="emoji">Emoji чимэглэл</label><select id="emoji"><option value="">Байхгүй</option><option>✨</option><option>❤️</option><option>🔥</option><option>😂</option><option>😭</option><option>⭐</option><option>💜</option><option>⚡</option><option>🌸</option></select>
<div class="row"><button id="addEmoji" class="secondary" type="button">Emoji нэмэх</button><button id="reset" class="secondary" type="button">Цэвэрлэх</button></div>
<button id="download" type="button">PNG татах</button><button id="copy" class="secondary" type="button">Зураг хуулах</button><div class="status" id="status" aria-live="polite"></div>
<p class="hint">Зураг таны хөтөч дээр боловсруулагдана. Сервер рүү автоматаар илгээгдэхгүй.</p></aside></main>
<script>
(()=>{const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let photo=null,emojiItems=[];
function fitImage(img){const scale=Math.min(470/img.width,470/img.height);return {w:img.width*scale,h:img.height*scale};}
function render(){ctx.clearRect(0,0,c.width,c.height);if(photo){const d=fitImage(photo);ctx.drawImage(photo,(640-d.w)/2,(640-d.h)/2-25,d.w,d.h);}
emojiItems.forEach((e,i)=>{ctx.font='58px system-ui';ctx.textAlign='center';ctx.fillText(e,520-(i%3)*62,100+Math.floor(i/3)*62);});
const t=$('caption').value.trim();if(t){const size=+$('font').value;ctx.font='900 '+size+'px system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.strokeStyle=$('outline').value;ctx.lineWidth=+$('width').value*2;ctx.strokeText(t,320,555,590);ctx.fillStyle=$('color').value;ctx.fillText(t,320,555,590);}}
$('image').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){$('status').textContent='Зургийн файл сонгоно уу.';return;}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;render();URL.revokeObjectURL(u);$('status').textContent='Зураг амжилттай нэмэгдлээ.'};im.onerror=()=>{$('status').textContent='Зураг нээж чадсангүй.';URL.revokeObjectURL(u)};im.src=u;});
['caption','font','color','outline','width'].forEach(id=>$(id).addEventListener('input',render));
$('addEmoji').onclick=()=>{const e=$('emoji').value;if(e){emojiItems.push(e);render();$('status').textContent='Emoji нэмэгдлээ.'}};
$('reset').onclick=()=>{photo=null;emojiItems=[];$('image').value='';$('caption').value='';render();$('status').textContent='Засварын талбар цэвэрлэгдлээ.'};
$('download').onclick=()=>{c.toBlob(b=>{if(!b){$('status').textContent='PNG үүсгэж чадсангүй.';return;}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='loreverse-sticker.png';a.click();URL.revokeObjectURL(u);$('status').textContent='PNG таталт эхэллээ.'},'image/png')};
$('copy').onclick=async()=>{try{const b=await new Promise(r=>c.toBlob(r,'image/png'));if(!b)throw Error('PNG үүсгэсэнгүй');if(!navigator.clipboard?.write)throw Error('Энэ хөтөч зураг хуулахыг дэмжихгүй байна. PNG татах товчийг ашиглаарай.');await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);$('status').textContent='Зураг clipboard-д хуулагдлаа.'}catch(e){$('status').textContent=e.message}};
render();})();
</script></body></html>
