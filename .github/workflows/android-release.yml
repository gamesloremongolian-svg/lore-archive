name: LOREVERSE Android APK and Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  android-release:
    name: Build Android release AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate LOREVERSE launcher icons
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          rsvg-convert -w 432 -h 432 assets/loreverse-adaptive-foreground.svg -o "$RES/drawable-nodpi/ic_launcher_foreground.png"
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/loreverse-app-icon.svg -o "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/values/loreverse_icon_colors.xml" <<'EOF'
          <resources><color name="loreverse_icon_background">#080914</color></resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/loreverse_icon_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Set app build version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("android/app/build.gradle")
          content = path.read_text()
          version_code = 100000 + int(os.environ["BUILD_NUMBER"])
          content, count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode.")
          content, count = re.subn(r'versionName\s+"[^"]+"', f'versionName "2.0.{os.environ["BUILD_NUMBER"]}"', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName.")
          path.write_text(content)
          print(f"Android versionName=2.0.{os.environ['BUILD_NUMBER']}, versionCode={version_code}")
          PY

      - name: Set Google Play target API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/variables.gradle")
          if not path.exists():
              raise SystemExit("Expected android/variables.gradle was not generated.")
          content = path.read_text()
          for key in ("compileSdkVersion", "targetSdkVersion"):
              pattern = rf"({key}\s*=\s*)\d+"
              content, count = re.subn(pattern, rf"\g<1>36", content, count=1)
              if count != 1:
                  raise SystemExit(f"Could not safely set {key} to API 36.")
          path.write_text(content)
          print("compileSdkVersion=36 and targetSdkVersion=36")
          PY

      - name: Configure and verify original LOREVERSE signing key
        id: signing
        run: |
          set -euo pipefail
          EXPECTED="1651193714a7e5610bbdc20fa228374db1728a955bc2e880b55e9def2f5ad343"
          KEYSTORE="$HOME/.android/loreverse-original.keystore"
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          valid=""
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ] && [ -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ]; then
            KEY_B64="$(printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
            if printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE" 2>/dev/null && [ -s "$KEYSTORE" ]; then
              echo "Persistent keystore decoded ($(wc -c < "$KEYSTORE" | tr -d ' ') bytes)."
              if KEY_LIST="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" 2>&1)"; then
                DEBUG_ALIAS="$(printf '%s\n' "$KEY_LIST" | awk -v expected="$EXPECTED" '
                  /^Alias name: / { current=substr($0, index($0, ": ") + 2) }
                  /SHA256: / {
                    fingerprint=$NF
                    gsub(":", "", fingerprint)
                    if (tolower(fingerprint) == tolower(expected)) { print current; exit }
                  }
                ')"
                if [ -n "$DEBUG_ALIAS" ]; then
                  echo "Original signing certificate found in persistent keystore (alias verified)."
                  ALIAS="$DEBUG_ALIAS"
                  STORE_PASS="$ANDROID_DEBUG_KEYSTORE_PASSWORD"
                  KEY_PASS="$ANDROID_DEBUG_KEYSTORE_PASSWORD"
                  if [ -n "$ANDROID_DEBUG_KEY_PASSWORD" ]; then KEY_PASS="$ANDROID_DEBUG_KEY_PASSWORD"; fi
                  valid="yes"
                else
                  echo "::warning::Keystore opened, but none of its aliases matched the installed LOREVERSE signing certificate."
                  printf '%s\n' "$KEY_LIST" | awk '/^Alias name: / { alias=$0 } /SHA256: / { print alias " " $0 }'
                fi
              else
                echo "::warning::Keystore bytes were decoded, but keytool could not open it with ANDROID_DEBUG_KEYSTORE_PASSWORD."
                printf '%s\n' "$KEY_LIST" | tail -n 3
              fi
            else
              echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not valid base64 or decoded to an empty file."
            fi
          fi
          if [ -z "$valid" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE" 2>/dev/null || true
            if [ -s "$KEYSTORE" ] && keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              echo "Candidate Android keystore opened."
              ALIAS="$ANDROID_KEY_ALIAS"
              STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
              KEY_PASS="$ANDROID_KEY_PASSWORD"
              valid="yes"
            fi
          fi
          if [ -z "$valid" ]; then
            echo "::error::No configured keystore could be opened. Check GitHub Actions secret names and keystore format."
            exit 1
          fi
          CERT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':')"
          if [ -z "$CERT" ] || [ "${CERT,,}" != "$EXPECTED" ]; then
            echo "::error::Keystore certificate does not match the installed LOREVERSE app. APK will not be built or published."
            exit 1
          fi
          echo "Original LOREVERSE signing certificate verified."
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = '''
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_STORE_PASSWORD")
                      keyAlias System.getenv("KEYSTORE_ALIAS")
                      keyPassword System.getenv("KEYSTORE_KEY_PASSWORD")
                  }
              }
          '''
          marker = "    buildTypes {"
          if marker not in s:
              raise SystemExit("Could not find Android buildTypes block.")
          s = s.replace(marker, block + "\n" + marker + '\n        debug { signingConfig signingConfigs.debug }', 1)
          p.write_text(s)
          PY

      - name: Build release Android App Bundle and installable APK
        working-directory: android
        run: ./gradlew bundleRelease assembleDebug

      - name: Prepare and verify direct-download APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | head -1 | grep -F "package: name='mn.loreverse.app'"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          printf '%s\n' "$CERT_OUTPUT" | tr -d ':' | grep -qi '1651193714a7e5610bbdc20fa228374db1728a955bc2e880b55e9def2f5ad343' || {
            echo "::error::Signing certificate does not match the known installed LOREVERSE app. APK will NOT be published."
            exit 1
          }
          mkdir -p release-apk
          cp "$APK" release-apk/LOREVERSE.apk

      - name: Sign AAB when upload-key secrets are configured
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          mkdir -p release-artifact
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE="$RUNNER_TEMP/loreverse-upload-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$ANDROID_KEY_ALIAS"
            jarsigner -verify "$AAB"
            cp "$AAB" release-artifact/LOREVERSE-release-signed.aab
            echo "artifact_name=LOREVERSE-release-signed" >> "$GITHUB_OUTPUT"
            echo "Signing completed and verified."
          else
            cp "$AAB" release-artifact/LOREVERSE-release-unsigned.aab
            echo "artifact_name=LOREVERSE-release-unsigned-TEST-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::Upload-key secrets are missing. This AAB is unsigned and cannot be submitted to Google Play."
          fi

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.artifact_name }}
          path: release-artifact/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: LOREVERSE Android Build #${{ github.run_number }}
          body: |
            LOREVERSE Android APK beta build.
            Package ID and signing certificate are verified against the previously installed LOREVERSE app before publication.
          prerelease: true
          make_latest: false
          files: release-apk/LOREVERSE.apk
          overwrite_files: true
          fail_on_unmatched_files: true
