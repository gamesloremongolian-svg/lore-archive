name: LOREVERSE Android APK and Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'assets/loreverse-app-icon.svg'
      - 'assets/loreverse-adaptive-foreground.svg'
      - 'index.html'
      - 'chat/**'
      - 'archive/**'
      - 'games/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.ts'

permissions:
  contents: write

jobs:
  android-release:
    name: Build Android release AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate LOREVERSE launcher icons
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          rsvg-convert -w 432 -h 432 assets/loreverse-adaptive-foreground.svg -o "$RES/drawable-nodpi/ic_launcher_foreground.png"
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/loreverse-app-icon.svg -o "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/values/loreverse_icon_colors.xml" <<'EOF'
          <resources><color name="loreverse_icon_background">#080914</color></resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/loreverse_icon_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Set app build version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("android/app/build.gradle")
          content = path.read_text()
          version_code = int(os.environ["BUILD_NUMBER"])
          content, count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode.")
          content, count = re.subn(r'versionName\s+"[^"]+"', f'versionName "1.0.{version_code}"', content, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName.")
          path.write_text(content)
          print(f"Android versionName=1.0.{version_code}, versionCode={version_code}")
          PY

      - name: Set Google Play target API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/variables.gradle")
          if not path.exists():
              raise SystemExit("Expected android/variables.gradle was not generated.")
          content = path.read_text()
          for key in ("compileSdkVersion", "targetSdkVersion"):
              pattern = rf"({key}\s*=\s*)\d+"
              content, count = re.subn(pattern, rf"\g<1>36", content, count=1)
              if count != 1:
                  raise SystemExit(f"Could not safely set {key} to API 36.")
          path.write_text(content)
          print("compileSdkVersion=36 and targetSdkVersion=36")
          PY

      - name: Configure persistent debug APK signing
        run: |
          set -euo pipefail
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_DEBUG_KEYSTORE_PASSWORD repository secret."; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/loreverse-debug.keystore"
          chmod 600 "$HOME/.android/loreverse-debug.keystore"
          echo "Checking keystore file and alias (password is never printed)."
          test -s "$HOME/.android/loreverse-debug.keystore" || { echo "::error::Decoded keystore file is empty."; exit 1; }
          keytool -list -keystore "$HOME/.android/loreverse-debug.keystore" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias loreverse
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "loreverse-debug.keystore" in s:
              raise SystemExit("Persistent signing configuration already exists; refusing duplicate patch.")
          block = '''
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/loreverse-debug.keystore")
                      storePassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
                      keyAlias "loreverse"
                      keyPassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
                  }
              }
          '''
          marker = "    buildTypes {"
          if marker not in s:
              raise SystemExit("Could not find Android buildTypes block.")
          s = s.replace(marker, block + "\n" + marker + '\n        debug { signingConfig signingConfigs.debug }', 1)
          p.write_text(s)
          PY
      - name: Verify persistent debug signing secrets
        run: |
          set -euo pipefail
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_DEBUG_KEYSTORE_PASSWORD repository secret."; exit 1; }

      - name: Build release Android App Bundle and installable APK
        working-directory: android
        run: ./gradlew bundleRelease assembleDebug

      - name: Prepare direct-download APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-apk
          cp "$APK" release-apk/LOREVERSE.apk

      - name: Sign AAB when upload-key secrets are configured
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          mkdir -p release-artifact
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE="$RUNNER_TEMP/loreverse-upload-key.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            jarsigner -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$ANDROID_KEY_ALIAS"
            jarsigner -verify "$AAB"
            cp "$AAB" release-artifact/LOREVERSE-release-signed.aab
            echo "artifact_name=LOREVERSE-release-signed" >> "$GITHUB_OUTPUT"
            echo "Signing completed and verified."
          else
            cp "$AAB" release-artifact/LOREVERSE-release-unsigned.aab
            echo "artifact_name=LOREVERSE-release-unsigned-TEST-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::Upload-key secrets are missing. This AAB is unsigned and cannot be submitted to Google Play."
          fi

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.artifact_name }}
          path: release-artifact/*.aab
          if-no-files-found: error
          retention-days: 14


      - name: Publish direct-download Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: LOREVERSE Android Build #${{ github.run_number }}
          body: |
            LOREVERSE Android APK beta build.
            This is a directly installable debug-signed testing build, not the Google Play production release.
            Install only if you trust this repository. Android may ask you to allow installation from this source.
          prerelease: true
          make_latest: false
          files: release-apk/LOREVERSE.apk
          overwrite_files: true
          fail_on_unmatched_files: true
# Re-run build after persistent Android signing secrets were configured.
