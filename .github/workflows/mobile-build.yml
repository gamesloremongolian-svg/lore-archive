name: LOREVERSE Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.html'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate inline JavaScript
        run: npm run check:web
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-pil
      - name: Apply LOREVERSE launcher icon
        run: python3 scripts/set-android-icon.py
      - name: Configure isolated test APK identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if 'applicationIdSuffix ".test"' in s:
              raise SystemExit("Test-only application ID suffix already configured; refusing duplicate patch.")
          marker = "    buildTypes {"
          if s.count(marker) != 1:
              raise SystemExit("Could not safely locate the Android buildTypes block.")
          s = s.replace(marker, marker + '\n        debug { applicationIdSuffix ".test" }', 1)
          p.write_text(s)
          print("Configured a separate .test package. The existing LOREVERSE app identity and signing key are untouched.")
          PY
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: loreverse-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
# Test APK uses Gradle's temporary debug signing and a separate .test application ID.

# Trigger safe side-by-side Android test build.
