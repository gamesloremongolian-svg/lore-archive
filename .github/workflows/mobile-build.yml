name: LOREVERSE Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'knowledge/**'
      - 'chat/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate LOREVERSE launcher icons
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          rsvg-convert -w 432 -h 432 assets/loreverse-adaptive-foreground.svg -o "$RES/drawable-nodpi/ic_launcher_foreground.png"
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/loreverse-app-icon.svg -o "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/values/loreverse_icon_colors.xml" <<'EOF'
          <resources><color name="loreverse_icon_background">#080914</color></resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/loreverse_icon_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Configure persistent debug APK signing
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 != '' && env.ANDROID_DEBUG_KEYSTORE_PASSWORD != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/loreverse-debug.keystore"
          chmod 600 "$HOME/.android/loreverse-debug.keystore"
          keytool -list -keystore "$HOME/.android/loreverse-debug.keystore" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias loreverse >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs" in s and "loreverse-debug.keystore" in s:
              raise SystemExit("Signing configuration already exists; refusing duplicate patch.")
          block = """
    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/loreverse-debug.keystore")
            storePassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
            keyAlias "loreverse"
            keyPassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
        }
    }
    """
          if "buildTypes {" not in s:
              raise SystemExit("Could not find Android buildTypes block.")
          s = s.replace("    buildTypes {", block + "\n    buildTypes {", 1)
          # Explicitly attach the persistent key to the debug variant.
          p.write_text(s)
          PY
      - name: Verify persistent debug signing secrets
        run: |
          set -euo pipefail
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_DEBUG_KEYSTORE_PASSWORD repository secret."; exit 1; }

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: loreverse-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
