name: LOREVERSE Android Release (New Signing Key)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed LOREVERSE APK and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set Android version and API
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, n = re.subn(r'versionCode\s+\d+', f'versionCode {100000 + int(os.environ["BUILD_NUMBER"])}', s, count=1)
          if n != 1: raise SystemExit("Could not set versionCode")
          s, n = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0.0"', s, count=1)
          if n != 1: raise SystemExit("Could not set versionName")
          p.write_text(s)
          v = Path("android/variables.gradle")
          t = v.read_text()
          for k in ("compileSdkVersion", "targetSdkVersion"):
            t, n = re.subn(rf'({k}\s*=\s*)\d+', rf'\g<1>36', t, count=1)
            if n != 1: raise SystemExit(f"Could not set {k}")
          v.write_text(t)
          PY

      - name: Configure new release signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/loreverse-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          export KEYSTORE_PATH="$KEYSTORE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          if s.count(marker) != 1:
            raise SystemExit("Could not safely locate buildTypes")
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          s = s.replace(marker, signing + "\n" + marker, 1)
          import re
          pattern = r'(buildTypes\s*\{[\s\S]*?\n\s*release\s*\{)'
          s, count = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', s, count=1)
          if count != 1:
            raise SystemExit("Could not safely configure release signing")
          p.write_text(s)
          PY
          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify AAB signature and 64-bit coverage
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          if unzip -l "$AAB" | grep -qE 'base/lib/[^/]+/'; then
            unzip -l "$AAB" | grep -q 'base/lib/arm64-v8a/' || {
              echo "::error::Native libraries are bundled but arm64-v8a is missing"
              exit 1
            }
          else
            echo "No native .so libraries found; 64-bit ABI coverage is not applicable to this pure-Java bundle."
          fi

      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | head -1 | grep -F "package: name='mn.loreverse.app'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release
          cp "$APK" release/LOREVERSE.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/LOREVERSE-release.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: loreverse-v1.0.0-${{ github.run_number }}
          name: LOREVERSE 1.0.0
          body: |
            LOREVERSE 1.0.0 — official first release with refreshed mobile layout and new signing key.
            Package ID: mn.loreverse.app
            Install only after uninstalling the previous app signed with the old key.
          prerelease: false
          make_latest: true
          files: |
            release/LOREVERSE.apk
            release/LOREVERSE-release.aab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LOREVERSE-1.0.0-release
          path: release/*
          if-no-files-found: error
          retention-days: 30
