name: Build LOREVERSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'assets/**'
      - 'admin/**'
      - 'archive/**'
      - 'chat/**'
      - 'community/**'
      - 'editorial/**'
      - 'games/**'
      - 'knowledge/**'
      - 'legal/**'
      - 'rank/**'
      - 'status/**'
      - 'uid-lookup/**'
      - 'universe-hub/**'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Capacitor's generated Android launcher resources are used here.
      # Custom SVG-to-PNG conversion was removed because GitHub runners may not include an SVG renderer.
      - name: Configure isolated test APK identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if 'applicationIdSuffix ".test"' in s:
              raise SystemExit("Test-only application ID suffix already configured; refusing duplicate patch.")
          marker = "    buildTypes {"
          if s.count(marker) != 1:
              raise SystemExit("Could not safely locate the Android buildTypes block.")
          s = s.replace(marker, marker + '\n        debug { applicationIdSuffix ".test" }', 1)
          p.write_text(s)
          print("Configured a separate .test package. Existing app identity and signing key are untouched.")
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LOREVERSE-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Test APK uses Gradle's temporary debug signing and a separate .test application ID.
