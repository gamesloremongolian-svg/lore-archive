name: Build LOREVERSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'assets/**'
      - 'admin/**'
      - 'archive/**'
      - 'chat/**'
      - 'community/**'
      - 'editorial/**'
      - 'games/**'
      - 'knowledge/**'
      - 'legal/**'
      - 'rank/**'
      - 'status/**'
      - 'uid-lookup/**'
      - 'universe-hub/**'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate LOREVERSE launcher icons
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          rsvg-convert -w 432 -h 432 assets/loreverse-adaptive-foreground.svg -o "$RES/drawable-nodpi/ic_launcher_foreground.png"
          for item in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${item%%:*}"
            size="${item##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/loreverse-app-icon.svg -o "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/values/loreverse_icon_colors.xml" <<'EOF'
          <resources><color name="loreverse_icon_background">#080914</color></resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/loreverse_icon_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Configure isolated test APK identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if 'applicationIdSuffix ".test"' in s:
              raise SystemExit("Test-only application ID suffix already configured; refusing duplicate patch.")
          marker = "    buildTypes {"
          if s.count(marker) != 1:
              raise SystemExit("Could not safely locate the Android buildTypes block.")
          s = s.replace(marker, marker + '\n        debug { applicationIdSuffix ".test" }', 1)
          p.write_text(s)
          print("Configured a separate .test package. Existing app identity and signing key are untouched.")
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LOREVERSE-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Test APK uses Gradle's temporary debug signing and a separate .test application ID.
