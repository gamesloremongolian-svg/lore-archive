<title>LOREVERSE — Түр засвартай</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 15%,#20372c 0%,#101713 55%,#0b100d 100%);color:#edf4ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.panel{width:min(100%,560px);text-align:center;padding:clamp(28px,7vw,56px);border:1px solid #35483b;border-radius:24px;background:#121c17dd;box-shadow:0 24px 80px #0007}.mark{width:64px;height:64px;margin:0 auto 24px;border-radius:18px;display:grid;place-items:center;background:#c5f36b;color:#142015;font-size:30px;font-weight:900;letter-spacing:-3px}.eyebrow{color:#c5f36b;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}h1{font-size:clamp(30px,7vw,46px);line-height:1.08;letter-spacing:-.04em;margin:14px 0}p{color:#b9c8bd;font-size:16px;line-height:1.75;margin:0}.line{width:44px;height:3px;background:#c5f36b;border-radius:9px;margin:26px auto 0}

</head>
<body>
<main class="panel">
<div class="mark" aria-hidden="true">L</div>
<div class="eyebrow">LOREVERSE</div>
<h1>Бид шинэчлэлт хийж байна.</h1>
<p>LOREVERSE түр хугацаанд засвартай байна. Шинэ загвар болон сайжруулалтаа бэлдэж дуусмагц эргэн нээгдэнэ.</p>
<div class="line"></div>
</main>
