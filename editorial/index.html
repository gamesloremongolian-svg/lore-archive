<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lore Archive Editorial</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#11111c;color:#f4f0ff;font:16px/1.5 system-ui}main{max-width:900px;margin:30px auto;padding:0 16px}.panel{background:#1c1c2c;border:1px solid #39364c;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;color:#bdb6d0;font-size:13px;margin:9px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;background:#11111c;color:white;border:1px solid #454057;border-radius:9px;padding:11px;font:inherit}textarea{min-height:90px}button{background:#805bb8;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:700;margin-top:12px}a{color:#cdb5ff}.muted{color:#bdb6d0;font-size:13px}.status{white-space:pre-wrap}.item{border-bottom:1px solid #39364c;padding:10px 0}[hidden]{display:none!important}
</style></head><body><main><p style="display:flex;justify-content:flex-end"><label for="lang">Interface language</label><select id="lang" style="width:auto;margin-left:10px"><option value="mn">Монгол</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></p><p><a href="../">← Lore Archive</a> · <a href="../admin/">Үндсэн админ</a></p><h1>Editorial CMS — Архивын өгөгдөл</h1><p class="muted">Франчайз, бүтээл, орчуулга. Нийтлэх эрхийг Supabase RLS шалгана.</p>
<section class="panel" id="login"><h2>Редактор нэвтрэх</h2><form id="loginForm" class="grid"><div><label>Имэйл</label><input id="email" type="email" required></div><div><label>Нууц үг</label><input id="password" type="password" required></div><div><button>Нэвтрэх</button></div></form><p id="authStatus" class="muted status"></p></section>
<div id="app" hidden><section class="panel"><p id="who" class="muted"></p><button id="logout">Гарах</button> <button id="refresh">Шинэчлэх</button><p id="status" class="muted status"></p></section>
<div class="grid"><section class="panel"><h2>Франчайз</h2><form id="frForm"><label>Нэр</label><input id="frName" required><label>Slug</label><input id="frSlug" required pattern="[a-z0-9-]+"><label>Ангилал</label><select id="frCat"><option value="game">Game</option><option value="anime">Anime</option><option value="manga">Manga</option><option value="light_novel">Light Novel</option><option value="web_novel">Web Novel</option><option value="mixed">Mixed</option></select><label>Тайлбар</label><textarea id="frDesc"></textarea><button>Ноорог хадгалах</button><p id="frMsg" class="muted status"></p></form></section>
<section class="panel"><h2>Бүтээл</h2><form id="workForm"><label>Франчайз</label><select id="frSelect" required></select><label>Үндсэн нэр</label><input id="workName" required><label>Slug</label><input id="workSlug" required pattern="[a-z0-9-]+"><label>Төрөл</label><select id="workType"><option value="game">Game</option><option value="anime">Anime</option><option value="manga">Manga</option><option value="light_novel">Light Novel</option><option value="web_novel">Web Novel</option><option value="visual_novel">Visual Novel</option><option value="other">Other</option></select><button>Ноорог хадгалах</button><p id="workMsg" class="muted status"></p></form></section></div>
<section class="panel"><h2>Орчуулга / Lore</h2><form id="trForm" class="grid"><div><label>Бүтээл</label><select id="workSelect" required></select></div><div><label>Хэл</label><select id="translationLang"><option value="mn">Монгол</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div><label>Гарчиг</label><input id="trTitle" required></div><div><label>Canon</label><select id="canon"><option value="unknown">Unknown</option><option value="canon">Canon</option><option value="non_canon">Non-canon</option><option value="theory">Theory</option></select></div><div><label>Spoiler</label><select id="spoiler"><option value="none">None</option><option value="minor">Minor</option><option value="major">Major</option><option value="full">Full</option></select></div><div><label>Төлөв</label><select id="trState"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option></select></div><div style="grid-column:1/-1"><label>Товч агуулга</label><textarea id="synopsis"></textarea><label>Эх сурвалж URL (мөр бүрээр)</label><textarea id="sources"></textarea><button>Хадгалах</button><p id="trMsg" class="muted status"></p></div></form></section>

<section class="panel"><h2>Дүр, газар, фракц / Entity</h2><form id="entityForm" class="grid"><div><label>Франчайз</label><select id="entityFranchise" required></select></div><div><label>Хамаарах бүтээл (сонголтоор)</label><select id="entityWork"><option value="">Франчайзын түвшинд</option></select></div><div><label>Төрөл</label><select id="entityType"><option value="character">Дүр</option><option value="location">Байршил</option><option value="faction">Фракц</option><option value="item">Эд зүйл</option><option value="species">Зүйл / угсаатан</option><option value="concept">Ойлголт</option><option value="other">Бусад</option></select></div><div><label>Үндсэн нэр</label><input id="entityName" required></div><div><label>Slug</label><input id="entitySlug" required pattern="[a-z0-9-]+"></div><div><label>Төлөв</label><select id="entityState"><option value="draft">Ноорог</option><option value="review">Хяналтад</option><option value="published">Нийтлэх</option></select></div><div style="grid-column:1/-1"><button>Entity хадгалах</button><p id="entityMsg" class="muted status"></p></div></form>
<form id="entityTrForm" class="grid"><div><label>Entity</label><select id="entitySelect" required></select></div><div><label>Хэл</label><select id="entityLang"><option value="mn">Монгол</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div><label>Харагдах нэр</label><input id="entityDisplay" required></div><div><label>Төлөв</label><select id="entityTrState"><option value="draft">Ноорог</option><option value="review">Хяналтад</option><option value="published">Нийтлэх</option></select></div><div style="grid-column:1/-1"><label>Тайлбар</label><textarea id="entityDescription"></textarea><label>Дэлгэрэнгүй мэдээлэл (JSON)</label><textarea id="entityContent" placeholder='{"age":"...","affiliation":"..."}'></textarea><label>Эх сурвалж URL (мөр бүрээр)</label><textarea id="entitySources"></textarea><button>Орчуулга хадгалах</button><p id="entityTrMsg" class="muted status"></p></div></form></section>
<section class="panel"><h2>Дүрүүдийн холбоо / Relations</h2><form id="relationForm" class="grid"><div><label>Эх entity</label><select id="relationFrom" required></select></div><div><label>Холбогдох entity</label><select id="relationTo" required></select></div><div><label>Холбооны төрөл</label><input id="relationType" placeholder="ally, rival, family, member_of..." required></div><div><label>Төлөв</label><select id="relationState"><option value="draft">Ноорог</option><option value="review">Хяналтад</option><option value="published">Нийтлэх</option></select></div><div style="grid-column:1/-1"><label>Холбооны тайлбар</label><textarea id="relationDescription"></textarea><button>Холбоос хадгалах</button><p id="relationMsg" class="muted status"></p></div></form><div id="relationList" class="muted"></div></section>
<section class="panel"><h2>Үйл явдлын Timeline</h2><form id="eventForm" class="grid"><div><label>Бүтээл</label><select id="eventWork" required></select></div><div><label>Үйл явдлын түлхүүр</label><input id="eventKey" required placeholder="fall-of-khaenriah"></div><div><label>Дараалал</label><input id="eventOrder" type="number" value="0"></div><div><label>Ертөнц доторх огноо</label><input id="eventDate" placeholder="500 жилийн өмнө"></div><div><label>Spoiler</label><select id="eventSpoiler"><option value="none">None</option><option value="minor">Minor</option><option value="major">Major</option><option value="full">Full</option></select></div><div><label>Төлөв</label><select id="eventState"><option value="draft">Ноорог</option><option value="review">Хяналтад</option><option value="published">Нийтлэх</option></select></div><div style="grid-column:1/-1"><button>Үйл явдал хадгалах</button><p id="eventMsg" class="muted status"></p></div></form>
<form id="eventTrForm" class="grid"><div><label>Үйл явдал</label><select id="eventSelect" required></select></div><div><label>Хэл</label><select id="eventLang"><option value="mn">Монгол</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div><label>Гарчиг</label><input id="eventTitle" required></div><div><label>Төлөв</label><select id="eventTrState"><option value="draft">Ноорог</option><option value="review">Хяналтад</option><option value="published">Нийтлэх</option></select></div><div style="grid-column:1/-1"><label>Товч тайлбар</label><textarea id="eventSummary"></textarea><label>Дэлгэрэнгүй (JSON)</label><textarea id="eventContent" placeholder='{"details":"..."}'></textarea><label>Эх сурвалж URL (мөр бүрээр)</label><textarea id="eventSources"></textarea><button>Timeline орчуулга хадгалах</button><p id="eventTrMsg" class="muted status"></p></div></form></section><section class="panel"><h2>Франчайзын жагсаалт</h2><div id="frList" class="muted"></div></section></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://nfacspfctvunwbxtvvyi.supabase.co","sb_publishable_hZOakxcNBY47UDgsJ0E6Aw_wJgAdLw1");
const $=x=>document.getElementById(x);let user=null;function say(id,t){$(id).textContent=t}
async function boot(){const{data:{session}}=await db.auth.getSession();user=session?.user||null;$("login").hidden=!!user;$("app").hidden=!user;if(!user)return;const{data:s}=await db.from("staff_members").select("role,active").eq("user_id",user.id).maybeSingle();if(!s?.active||!["owner","admin","editor"].includes(s.role)){$("login").hidden=false;$("app").hidden=true;say("authStatus","Энэ хэрэглэгч редакторын эрхгүй.");return}say("who",user.email+" · "+s.role);await load()}
async function load(){
 const {data:f,error}=await db.from("archive_franchises").select("id,name,slug,category,status").order("name");
 if(error){say("status",error.message);return}
 const opts=(rows,label)=>rows.map(x=>'<option value="'+x.id+'">'+label(x)+'</option>').join("");
 $("frSelect").innerHTML=opts(f||[],x=>x.name);
 $("entityFranchise").innerHTML=opts(f||[],x=>x.name);
 $("frList").innerHTML=(f||[]).map(x=>'<div class="item"><b>'+x.name+'</b> · '+x.category+' · '+x.status+'<br><small>'+x.slug+'</small></div>').join("")||"Бичлэг алга";
 const {data:w,error:e}=await db.from("archive_works").select("id,franchise_id,canonical_title,work_type").order("canonical_title");
 if(e){say("status",e.message);return}
 $("workSelect").innerHTML=opts(w||[],x=>x.canonical_title+" · "+x.work_type);
 $("eventWork").innerHTML=$("workSelect").innerHTML;
 $("entityWork").innerHTML='<option value="">Франчайзын түвшинд</option>'+(w||[]).map(x=>'<option value="'+x.id+'">'+x.canonical_title+'</option>').join("");
 const {data:entities,error:ee}=await db.from("archive_entities").select("id,canonical_name,entity_type,status").order("canonical_name");
 if(ee){say("status",ee.message);return}
 const entOpts=opts(entities||[],x=>x.canonical_name+" · "+x.entity_type);
 $("entitySelect").innerHTML=entOpts;$("relationFrom").innerHTML=entOpts;$("relationTo").innerHTML=entOpts;
 const {data:relations,error:re}=await db.from("archive_entity_relations").select("id,relation_type,status,from_entity_id,to_entity_id").order("created_at",{ascending:false}).limit(100);
 if(!re){const names=new Map((entities||[]).map(x=>[x.id,x.canonical_name]));$("relationList").innerHTML=(relations||[]).map(r=>'<div class="item">'+(names.get(r.from_entity_id)||"Entity")+' → '+(names.get(r.to_entity_id)||"Entity")+' · '+r.relation_type+' · '+r.status+'</div>').join("")}
 const {data:events,error:ev}=await db.from("archive_timeline_events").select("id,event_key,sort_order,status").order("sort_order");
 if(ev){say("status",ev.message);return}
 $("eventSelect").innerHTML=opts(events||[],x=>x.event_key+" · #"+x.sort_order);
 say("status","Өгөгдлийн сан холбогдсон. Ноорог, хяналтын болон нийтлэгдсэн төлөвийг тус тусад нь удирдана.");
}
$("loginForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)say("authStatus",error.message);else boot()};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};$("refresh").onclick=load;
$("frForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.from("archive_franchises").insert({name:$("frName").value.trim(),slug:$("frSlug").value.trim(),category:$("frCat").value,description:$("frDesc").value.trim(),created_by:user.id});say("frMsg",error?error.message:"Франчайз ноорог хадгалагдлаа.");if(!error){e.target.reset();load()}};
$("workForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.from("archive_works").insert({franchise_id:$("frSelect").value,canonical_title:$("workName").value.trim(),slug:$("workSlug").value.trim(),work_type:$("workType").value,created_by:user.id});say("workMsg",error?error.message:"Бүтээлийн ноорог хадгалагдлаа.");if(!error){e.target.reset();load()}};
$("trForm").onsubmit=async e=>{e.preventDefault();const urls=$("sources").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(urls.some(x=>!/^https?:\/\//i.test(x))){say("trMsg","Эх сурвалжийн URL буруу байна.");return}const state=$("trState").value;const{error}=await db.from("archive_work_translations").upsert({work_id:$("workSelect").value,language_code:$("translationLang").value,title:$("trTitle").value.trim(),synopsis:$("synopsis").value.trim(),canon_status:$("canon").value,spoiler_level:$("spoiler").value,editorial_status:state,sources:urls.map(url=>({url})),author_id:user.id,published_at:state==="published"?new Date().toISOString():null},{onConflict:"work_id,language_code"});say("trMsg",error?error.message:"Орчуулга хадгалагдлаа.")};

$("entityForm").onsubmit=async e=>{e.preventDefault();const work=$("entityWork").value||null;const {error}=await db.from("archive_entities").insert({franchise_id:$("entityFranchise").value,work_id:work,entity_type:$("entityType").value,slug:$("entitySlug").value.trim(),canonical_name:$("entityName").value.trim(),status:$("entityState").value,created_by:user.id});say("entityMsg",error?error.message:"Entity хадгалагдлаа.");if(!error){e.target.reset();await load()}};
$("entityTrForm").onsubmit=async e=>{e.preventDefault();let content={};try{content=$("entityContent").value.trim()?JSON.parse($("entityContent").value):{}}catch{say("entityTrMsg","Дэлгэрэнгүй JSON формат буруу байна.");return}const urls=$("entitySources").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(urls.some(x=>!/^https?:\/\//i.test(x))){say("entityTrMsg","Эх сурвалжийн URL буруу байна.");return}const state=$("entityTrState").value;const {error}=await db.from("archive_entity_translations").upsert({entity_id:$("entitySelect").value,language_code:$("entityLang").value,display_name:$("entityDisplay").value.trim(),description:$("entityDescription").value.trim(),content,sources:urls.map(url=>({url})),editorial_status:state,author_id:user.id,published_at:state==="published"?new Date().toISOString():null},{onConflict:"entity_id,language_code"});say("entityTrMsg",error?error.message:"Entity орчуулга хадгалагдлаа.")};
$("relationForm").onsubmit=async e=>{e.preventDefault();const {error}=await db.from("archive_entity_relations").upsert({from_entity_id:$("relationFrom").value,to_entity_id:$("relationTo").value,relation_type:$("relationType").value.trim(),description:$("relationDescription").value.trim(),status:$("relationState").value,created_by:user.id},{onConflict:"from_entity_id,to_entity_id,relation_type"});say("relationMsg",error?error.message:"Entity холбоос хадгалагдлаа.");if(!error)load()};
$("eventForm").onsubmit=async e=>{e.preventDefault();const {error}=await db.from("archive_timeline_events").insert({work_id:$("eventWork").value,event_key:$("eventKey").value.trim(),sort_order:Number($("eventOrder").value)||0,in_universe_date:$("eventDate").value.trim()||null,spoiler_level:$("eventSpoiler").value,status:$("eventState").value,created_by:user.id});say("eventMsg",error?error.message:"Timeline үйл явдал хадгалагдлаа.");if(!error){e.target.reset();await load()}};
$("eventTrForm").onsubmit=async e=>{e.preventDefault();let content={};try{content=$("eventContent").value.trim()?JSON.parse($("eventContent").value):{}}catch{say("eventTrMsg","Дэлгэрэнгүй JSON формат буруу байна.");return}const urls=$("eventSources").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(urls.some(x=>!/^https?:\/\//i.test(x))){say("eventTrMsg","Эх сурвалжийн URL буруу байна.");return}const state=$("eventTrState").value;const {error}=await db.from("archive_timeline_translations").upsert({event_id:$("eventSelect").value,language_code:$("eventLang").value,title:$("eventTitle").value.trim(),summary:$("eventSummary").value.trim(),content,sources:urls.map(url=>({url})),editorial_status:state,author_id:user.id,published_at:state==="published"?new Date().toISOString():null},{onConflict:"event_id,language_code"});say("eventTrMsg",error?error.message:"Timeline орчуулга хадгалагдлаа.")};
\ndb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script><script src="../assets/js/i18n.js" defer></script></body></html>
