<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lore Archive Editorial</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#11111c;color:#f4f0ff;font:16px/1.5 system-ui}main{max-width:900px;margin:30px auto;padding:0 16px}.panel{background:#1c1c2c;border:1px solid #39364c;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;color:#bdb6d0;font-size:13px;margin:9px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;background:#11111c;color:white;border:1px solid #454057;border-radius:9px;padding:11px;font:inherit}textarea{min-height:90px}button{background:#805bb8;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:700;margin-top:12px}a{color:#cdb5ff}.muted{color:#bdb6d0;font-size:13px}.status{white-space:pre-wrap}.item{border-bottom:1px solid #39364c;padding:10px 0}[hidden]{display:none!important}
</style></head><body><main><p><a href="../">← Lore Archive</a> · <a href="../admin/">Үндсэн админ</a></p><h1>Editorial CMS — Архивын өгөгдөл</h1><p class="muted">Франчайз, бүтээл, орчуулга. Нийтлэх эрхийг Supabase RLS шалгана.</p>
<section class="panel" id="login"><h2>Редактор нэвтрэх</h2><form id="loginForm" class="grid"><div><label>Имэйл</label><input id="email" type="email" required></div><div><label>Нууц үг</label><input id="password" type="password" required></div><div><button>Нэвтрэх</button></div></form><p id="authStatus" class="muted status"></p></section>
<div id="app" hidden><section class="panel"><p id="who" class="muted"></p><button id="logout">Гарах</button> <button id="refresh">Шинэчлэх</button><p id="status" class="muted status"></p></section>
<div class="grid"><section class="panel"><h2>Франчайз</h2><form id="frForm"><label>Нэр</label><input id="frName" required><label>Slug</label><input id="frSlug" required pattern="[a-z0-9-]+"><label>Ангилал</label><select id="frCat"><option value="game">Game</option><option value="anime">Anime</option><option value="manga">Manga</option><option value="light_novel">Light Novel</option><option value="web_novel">Web Novel</option><option value="mixed">Mixed</option></select><label>Тайлбар</label><textarea id="frDesc"></textarea><button>Ноорог хадгалах</button><p id="frMsg" class="muted status"></p></form></section>
<section class="panel"><h2>Бүтээл</h2><form id="workForm"><label>Франчайз</label><select id="frSelect" required></select><label>Үндсэн нэр</label><input id="workName" required><label>Slug</label><input id="workSlug" required pattern="[a-z0-9-]+"><label>Төрөл</label><select id="workType"><option value="game">Game</option><option value="anime">Anime</option><option value="manga">Manga</option><option value="light_novel">Light Novel</option><option value="web_novel">Web Novel</option><option value="visual_novel">Visual Novel</option><option value="other">Other</option></select><button>Ноорог хадгалах</button><p id="workMsg" class="muted status"></p></form></section></div>
<section class="panel"><h2>Орчуулга / Lore</h2><form id="trForm" class="grid"><div><label>Бүтээл</label><select id="workSelect" required></select></div><div><label>Хэл</label><select id="lang"><option value="mn">Монгол</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div><label>Гарчиг</label><input id="trTitle" required></div><div><label>Canon</label><select id="canon"><option value="unknown">Unknown</option><option value="canon">Canon</option><option value="non_canon">Non-canon</option><option value="theory">Theory</option></select></div><div><label>Spoiler</label><select id="spoiler"><option value="none">None</option><option value="minor">Minor</option><option value="major">Major</option><option value="full">Full</option></select></div><div><label>Төлөв</label><select id="trState"><option value="draft">Draft</option><option value="review">Review</option><option value="published">Published</option></select></div><div style="grid-column:1/-1"><label>Товч агуулга</label><textarea id="synopsis"></textarea><label>Эх сурвалж URL (мөр бүрээр)</label><textarea id="sources"></textarea><button>Хадгалах</button><p id="trMsg" class="muted status"></p></div></form></section>
<section class="panel"><h2>Франчайзын жагсаалт</h2><div id="frList" class="muted"></div></section></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://nfacspfctvunwbxtvvyi.supabase.co","sb_publishable_hZOakxcNBY47UDgsJ0E6Aw_wJgAdLw1");
const $=x=>document.getElementById(x);let user=null;function say(id,t){$(id).textContent=t}
async function boot(){const{data:{session}}=await db.auth.getSession();user=session?.user||null;$("login").hidden=!!user;$("app").hidden=!user;if(!user)return;const{data:s}=await db.from("staff_members").select("role,active").eq("user_id",user.id).maybeSingle();if(!s?.active||!["owner","admin","editor"].includes(s.role)){$("login").hidden=false;$("app").hidden=true;say("authStatus","Энэ хэрэглэгч редакторын эрхгүй.");return}say("who",user.email+" · "+s.role);await load()}
async function load(){const{data:f,error}=await db.from("archive_franchises").select("id,name,slug,category,status").order("name");if(error){say("status",error.message);return}$("frSelect").innerHTML=(f||[]).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join("");$("frList").innerHTML=(f||[]).map(x=>'<div class="item"><b>'+x.name+'</b> · '+x.category+' · '+x.status+'<br><small>'+x.slug+'</small></div>').join("")||"Бичлэг алга";const{data:w,error:e}=await db.from("archive_works").select("id,canonical_title,work_type").order("canonical_title");if(e){say("status",e.message);return}$("workSelect").innerHTML=(w||[]).map(x=>'<option value="'+x.id+'">'+x.canonical_title+' · '+x.work_type+'</option>').join("");say("status","Өгөгдлийн сан холбогдсон. Ноорог нийтэд харагдахгүй.")}
$("loginForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)say("authStatus",error.message);else boot()};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};$("refresh").onclick=load;
$("frForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.from("archive_franchises").insert({name:$("frName").value.trim(),slug:$("frSlug").value.trim(),category:$("frCat").value,description:$("frDesc").value.trim(),created_by:user.id});say("frMsg",error?error.message:"Франчайз ноорог хадгалагдлаа.");if(!error){e.target.reset();load()}};
$("workForm").onsubmit=async e=>{e.preventDefault();const{error}=await db.from("archive_works").insert({franchise_id:$("frSelect").value,canonical_title:$("workName").value.trim(),slug:$("workSlug").value.trim(),work_type:$("workType").value,created_by:user.id});say("workMsg",error?error.message:"Бүтээлийн ноорог хадгалагдлаа.");if(!error){e.target.reset();load()}};
$("trForm").onsubmit=async e=>{e.preventDefault();const urls=$("sources").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(urls.some(x=>!/^https?:\/\//i.test(x))){say("trMsg","Эх сурвалжийн URL буруу байна.");return}const state=$("trState").value;const{error}=await db.from("archive_work_translations").upsert({work_id:$("workSelect").value,language_code:$("lang").value,title:$("trTitle").value.trim(),synopsis:$("synopsis").value.trim(),canon_status:$("canon").value,spoiler_level:$("spoiler").value,editorial_status:state,sources:urls.map(url=>({url})),author_id:user.id,published_at:state==="published"?new Date().toISOString():null},{onConflict:"work_id,language_code"});say("trMsg",error?error.message:"Орчуулга хадгалагдлаа.")};
db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script></body></html>
