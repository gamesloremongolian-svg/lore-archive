<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151c"><title>Гишүүдийн Profile — LOREVERSE</title>
<style>
:root{color-scheme:dark;--bg:#0d1218;--panel:#151e28;--line:#2b3947;--text:#edf4f0;--muted:#9aabb0;--green:#91bd77;--gold:#e8c879}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#294536 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}a{color:var(--green);text-decoration:none}.brand{font-weight:950;letter-spacing:.12em;color:white}.hero{padding:30px 0 18px}.eyebrow{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.2em}.hero h1{font-size:clamp(28px,6vw,42px);margin:6px 0}.muted,.note{color:var(--muted)}.panel{background:linear-gradient(145deg,#192631,#131b24);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}.search{display:flex;gap:8px}.search input,input{min-width:0;flex:1;background:#0d151c;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;font:inherit}.btn{border:1px solid var(--line);background:#243442;color:white;padding:11px 15px;border-radius:11px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(110deg,#4f7c58,#769e62);border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.member{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:#101820}.avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;display:grid;place-items:center;background:#2a3d35;color:var(--gold);font-size:23px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.member b{display:block}.member small{color:var(--muted)}.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.profile-head .avatar{width:90px;height:90px;flex-basis:90px;font-size:34px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{padding:12px 16px;background:#0e171f;border:1px solid var(--line);border-radius:12px;min-width:110px}.stat b{display:block;font-size:22px;color:var(--green)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{display:grid;gap:5px;color:var(--muted);font-size:12px}.formgrid .wide{grid-column:1/-1}.hidden{display:none!important}#status{min-height:20px;color:var(--gold);font-size:13px}.pill{font-size:11px;color:var(--gold);border:1px solid #77683b;padding:3px 9px;border-radius:30px}@media(max-width:560px){.search{flex-direction:column}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.panel{padding:15px}}
</style></head><body><div class="wrap">
<header class="top"><a class="brand" href="../">✦ LOREVERSE</a><a href="../">← Нүүр хуудас</a></header>
<section class="hero"><div class="eyebrow">LOREVERSE COMMUNITY</div><h1>Гишүүдийн Profile</h1><p class="muted">Өөрийн профайлаа тохируулж, бусад архивчдын профайлыг хараарай.</p></section>
<section class="panel"><h2>Гишүүн хайх</h2><div class="search"><input id="searchInput" placeholder="Нэрээр хайх..." maxlength="60"><button class="btn primary" id="searchBtn">Хайх</button></div><p id="status" role="status"></p><div id="memberList" class="grid"></div></section>
<section class="panel hidden" id="profilePanel"><div class="profile-head"><div class="avatar" id="profileAvatar">✦</div><div><div class="eyebrow">ARCHIVIST PROFILE</div><h2 id="profileName">Гишүүн</h2><span class="pill" id="profileRank">Rookie</span></div></div><div class="stats"><div class="stat"><b id="profileXp">0</b><small>Нийт XP</small></div><div class="stat"><b id="profileSince">—</b><small>Нэгдсэн огноо</small></div></div><p class="note" id="profileHint"></p></section>
<section class="panel hidden" id="editPanel"><h2>Миний профайл засах</h2><p class="muted">Зөвхөн өөрийн дэлгэцийн нэр, аватарын зургийн холбоосыг өөрчилнө.</p><div class="formgrid"><label>Дэлгэцийн нэр<input id="displayName" maxlength="40" placeholder="Таны харагдах нэр"></label><label>Аватарын зураг URL<input id="avatarUrl" type="url" maxlength="500" placeholder="https://..."></label></div><p><button class="btn primary" id="saveProfile">Хадгалах</button> <button class="btn" id="logout">Гарах</button></p></section>
</div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.119.0";
const sb=createClient("https://nfacspfctvunwbxtvvyi.supabase.co","sb_publishable_hZOakxcNBY47UDgsJ0E6Aw_wJgAdLw1");
const $=id=>document.getElementById(id), ladder=[["Rookie",0],["Explorer",100],["Scholar",500],["Lorekeeper",1500],["Master Archivist",4000],["Mythic Archivist",10000]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rank(x){let a=ladder[0];for(const r of ladder)if(Number(x)>=r[1])a=r;return a[0]}
function avatar(url,name){return url?'<img src="'+esc(url)+'" alt="" referrerpolicy="no-referrer">':esc((name||"✦").trim().charAt(0).toUpperCase()||"✦")}
function card(p){return '<a class="member" href="./?id='+encodeURIComponent(p.user_id)+'"><div class="avatar">'+avatar(p.avatar_url,p.display_name)+'</div><div><b>'+esc(p.display_name||"LOREVERSE гишүүн")+'</b><small>'+esc(rank(p.total_xp))+' · '+Number(p.total_xp||0).toLocaleString()+' XP</small></div></a>'}
async function search(){ $("status").textContent="Хайж байна...";const {data,error}=await sb.rpc("search_public_profiles",{p_query:$("searchInput").value.trim(),p_limit:24});if(error){$("status").textContent="Гишүүдийг ачаалж чадсангүй: "+error.message;return} $("memberList").innerHTML=(data||[]).map(card).join("")||"<p class='muted'>Илэрц олдсонгүй.</p>";$("status").textContent=(data||[]).length+" гишүүн";}
async function showProfile(id){$("profilePanel").classList.remove("hidden");$("profileHint").textContent="Профайлын мэдээлэл ачаалж байна...";const {data,error}=await sb.rpc("get_public_profile",{p_user_id:id});const p=Array.isArray(data)?data[0]:data;if(error||!p){$("profileHint").textContent="Энэ профайлыг олсонгүй.";return}$("profileName").textContent=p.display_name;$("profileAvatar").innerHTML=avatar(p.avatar_url,p.display_name);$("profileRank").textContent=rank(p.total_xp);$("profileXp").textContent=Number(p.total_xp||0).toLocaleString();$("profileSince").textContent=p.created_at?new Date(p.created_at).toLocaleDateString("mn-MN"):"—";$("profileHint").textContent="Нийтийн профайл · Имэйл болон хувийн мэдээлэл харуулахгүй.";$("profilePanel").scrollIntoView({behavior:"smooth",block:"start"});}
async function init(){const {data:{user}}=await sb.auth.getUser();if(user){$("editPanel").classList.remove("hidden");const {data:p}=await sb.from("profiles").select("display_name,avatar_url").eq("id",user.id).maybeSingle();$("displayName").value=p?.display_name||"";$("avatarUrl").value=p?.avatar_url||"";}await search();const id=new URLSearchParams(location.search).get("id");if(id){if(!/^[0-9a-f-]{36}$/i.test(id)){$("status").textContent="Профайлын ID буруу байна.";return}await showProfile(id)}}
$("searchBtn").onclick=search;$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("saveProfile").onclick=async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){$("status").textContent="Нэвтэрч байж профайлаа засна.";return}const display_name=$("displayName").value.trim(),avatar_url=$("avatarUrl").value.trim()||null;if(display_name.length<2){$("status").textContent="Нэр дор хаяж 2 тэмдэгт байна.";return}if(avatar_url&&!/^https:\/\//i.test(avatar_url)){$("status").textContent="Аватарын холбоос HTTPS байх ёстой.";return}const {error}=await sb.from("profiles").update({display_name,avatar_url,updated_at:new Date().toISOString()}).eq("id",user.id);$("status").textContent=error?"Хадгалж чадсангүй: "+error.message:"Профайл амжилттай хадгалагдлаа.";if(!error)search()};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.onAuthStateChange(()=>{});
init();
</script></body></html>
